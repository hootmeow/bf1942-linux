# Build settings for src/build.sh (sourced as bash).
OUTPUT="installers/opensuse/opensuse_bfsmd_setup.sh"
LABEL="openSUSE"
PKG_TOOL="zypper"
# Space-separated: any of these /etc/os-release IDs is a supported target.
OS_ID="opensuse-leap opensuse-tumbleweed opensuse-slowroll"
OS_NAME="openSUSE Leap 16 / Tumbleweed"
OS_VERSION=""
# Fragment search order: first match wins. The firewall (firewalld) and the
# SELinux relabel step are shared with the dnf family.
FRAGMENTS="distros/opensuse families/dnf common"
